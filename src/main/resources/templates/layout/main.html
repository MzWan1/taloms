<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle} + ' | TALOMS'">TALOMS</title>
  <meta name="theme-color" content="#1B3A6B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" th:href="@{/manifest.webmanifest}">
  <link rel="apple-touch-icon" th:href="@{/icons/icon.svg}">
  <link th:href="@{/css/taloms.css}" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Offline Banner -->
<div id="offline-banner" class="alert alert-warning py-2 mb-0 text-center" style="display:none;">
  <i class="bi bi-wifi-off me-2"></i>
  <span id="offline-banner-text">You are offline. Changes will sync when connectivity returns.</span>
  <span id="outbox-count" class="badge bg-warning text-dark ms-2" style="display:none;">0 queued</span>
</div>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-navy shadow-sm">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
      <i class="bi bi-geo-alt-fill me-2"></i>TALOMS
    </a>
    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#navbarMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/dashboard}">
            <i class="bi bi-speedometer2 me-1"></i>Dashboard
          </a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
          <a class="nav-link" th:href="@{/users}">
            <i class="bi bi-people me-1"></i>Users
          </a>
        </li>
        <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','CHIEF')">
          <a class="nav-link" href="#">
            <i class="bi bi-building me-1"></i>Authorities
          </a>
        </li>
        <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','CHIEF','HEADSMAN')">
          <a class="nav-link" href="#">
            <i class="bi bi-file-earmark-text me-1"></i>PTOs
          </a>
        </li>
        <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','CHIEF','HEADSMAN')">
          <a class="nav-link" href="#">
            <i class="bi bi-map me-1"></i>Parcels
          </a>
        </li>
      </ul>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#"
             data-bs-toggle="dropdown">
            <i class="bi bi-person-circle me-1"></i>
            <span sec:authentication="name">User</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <a class="dropdown-item" th:href="@{/users/change-password}">
                <i class="bi bi-key me-2"></i>Change Password
              </a>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <form th:action="@{/logout}" method="post">
                <button type="submit" class="dropdown-item text-danger">
                  <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button>
              </form>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Page Content -->
<div class="container-fluid px-4 py-4">
  <!-- Flash messages -->
  <div th:if="${successMessage}"
       class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="bi bi-check-circle me-2"></i>
    <span th:text="${successMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${errorMessage}"
       class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-circle me-2"></i>
    <span th:text="${errorMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <!-- Page fragment -->
  <div th:replace="${content}">
    Page content goes here
  </div>
</div>

<script>
  if (typeof navigator !== 'undefined' && navigator.serviceWorker) {
    navigator.serviceWorker.register('/sw.js')
      .then(function () { console.log('SW registered'); })
      .catch(function (err) { console.error('SW registration failed:', err); });
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (window.Taloms && Taloms.Network) {
      Taloms.Network.init();
      Taloms.Sync.init();
    }
  });
</script>

<script th:src="@{/js/offline-db.js}"></script>
<script th:src="@{/js/taloms.js}"></script>
<script>
  (function () {
    'use strict';
    function isSlowConnection() {
      var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      return !!(conn && (conn.effectiveType === '2g' || conn.effectiveType === 'slow-2g' || conn.saveData));
    }

    function loadScript(src, integrity) {
      var script = document.createElement('script');
      script.src = src;
      script.async = true;
      if (integrity) script.integrity = integrity;
      document.body.appendChild(script);
    }

    function loadStylesheet(href) {
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = href;
      document.head.appendChild(link);
    }

    function loadCriticalAssets() {
      loadStylesheet('https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css');
      loadStylesheet('https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css');
      loadScript('https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js', 'sha384-kenU1KF7C2WfgW5vsmda9KxxzWbqYsKcvZunfNWi4ojcwK7rsyIu4WDFfVYWeIRCq');
    }

    function loadNonCriticalAssets() {
      loadStylesheet('https://unpkg.com/leaflet@1.9.4/dist/leaflet.css');
      loadScript('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js');
    }

    if (isSlowConnection()) {
      loadCriticalAssets();
    } else {
      loadCriticalAssets();
      loadNonCriticalAssets();
    }
  })();
</script>
</body>
</html>
