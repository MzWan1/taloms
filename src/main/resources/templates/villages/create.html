<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Village | TALOMS</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/taloms.css}" rel="stylesheet">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: navbar('villages')}"></nav>

<div class="container-fluid px-4 py-4">

    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible fade show border-0 shadow-sm mb-4">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}"
         class="alert alert-danger alert-dismissible fade show border-0 shadow-sm mb-4">
        <i class="bi bi-exclamation-circle-fill me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex align-items-start justify-content-between mb-4 flex-wrap gap-3">
        <div>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-1 small">
                    <li class="breadcrumb-item">
                        <a th:href="@{/dashboard}" class="text-muted text-decoration-none">Dashboard</a>
                    </li>
                    <li class="breadcrumb-item">
                        <a th:href="@{/villages}" class="text-muted text-decoration-none">Villages</a>
                    </li>
                    <li class="breadcrumb-item active">Add Village</li>
                </ol>
            </nav>
            <h4 class="fw-bold text-navy mb-0">
                <i class="bi bi-plus-circle me-2"></i>Add Village
            </h4>
            <p class="text-muted small mb-0">Add a new village to your authority</p>
        </div>
        <a th:href="@{/villages}" class="btn btn-outline-secondary px-3">
            <i class="bi bi-arrow-left me-1"></i>Back
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <form th:action="@{/villages/create}" method="post" th:object="${form}">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white border-bottom py-3">
                        <h6 class="fw-bold text-navy mb-0">
                            <i class="bi bi-info-circle me-2"></i>Village Details
                        </h6>
                    </div>
                    <div class="card-body p-4">
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="villageName" class="form-label">Village Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="villageName"
                                       th:field="*{villageName}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="region" class="form-label">Region</label>
                                <input type="text" class="form-control" id="region"
                                       th:field="*{region}">
                            </div>
                            <div class="col-md-6 position-relative">
                                <label for="headmanSearch" class="form-label">Headman</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-person"></i>
                                    </span>
                                    <input type="text"
                                           id="headmanSearch"
                                           class="form-control"
                                           placeholder="Type 3+ characters to search (name or email)..."
                                           autocomplete="off">
                                <input type="hidden"
                                       id="headmanId"
                                       th:field="*{headmanId}">
                                <input type="hidden"
                                       id="authorityId"
                                       th:field="*{traditionalAuthorityId}">
                                </div>
                                <div id="headmanResults" class="list-group position-absolute w-100 shadow-sm"
                                     style="z-index: 1000; max-height: 200px; overflow-y: auto; display: none;">
                                </div>
                                <div id="headmanSelected" class="form-text text-success" style="display: none;">
                                    <i class="bi bi-check-circle me-1"></i>
                                    <span id="headmanSelectedName"></span>
                                </div>
                            </div>
                            <div class="col-12">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description"
                                          th:field="*{description}" rows="3"></textarea>
                            </div>
                            <input type="hidden" th:field="*{traditionalAuthorityId}">
                        </div>
                    </div>
                    <div class="card-footer bg-white border-top py-3 d-flex justify-content-end gap-2">
                        <a th:href="@{/villages}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-navy fw-semibold">
                            <i class="bi bi-check-circle me-1"></i>Add Village
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

</div>

<script src="/js/bootstrap.bundle.min.js"></script>
<script>
    // ── User search for Headman ──────────────────────────────────────────
    function setupUserSearch(searchInputId, resultsDivId, selectedDivId,
                             selectedNameSpanId, hiddenInputId, role) {
        const searchInput = document.getElementById(searchInputId);
        const resultsDiv = document.getElementById(resultsDivId);
        const selectedDiv = document.getElementById(selectedDivId);
        const selectedNameSpan = document.getElementById(selectedNameSpanId);
        const hiddenInput = document.getElementById(hiddenInputId);
        let debounceTimer;

        searchInput.addEventListener('input', function () {
            const query = this.value.trim();
            clearTimeout(debounceTimer);

            if (query.length < 3) {
                resultsDiv.style.display = 'none';
                return;
            }

            debounceTimer = setTimeout(() => {
                let url = '/api/users/search?q=' + encodeURIComponent(query);
                if (role) {
                    url += '&role=' + encodeURIComponent(role);
        const authorityIdInput = document.getElementById('authorityId')?.value;
                const authorityId = document.getElementById('authorityId')?.value;
                if (authorityId) {
                    url += '&authorityId=' + encodeURIComponent(authorityId);
                }
                fetch(url)
                    .then(r => r.json())
                    .then(data => {
                        resultsDiv.innerHTML = '';
                        if (data.data && data.data.length > 0) {
                            data.data.forEach(user => {
                                const item = document.createElement('button');
                                item.type = 'button';
                                item.className = 'list-group-item list-group-item-action';
                                item.innerHTML = '<strong>' + user.fullName + '</strong>' +
                                    '<br><small class="text-muted">' + user.email + '</small>';
                                item.addEventListener('click', function () {
                                    hiddenInput.value = user.id;
                                    selectedNameSpan.textContent = user.fullName;
                                    selectedDiv.style.display = 'block';
                                    resultsDiv.style.display = 'none';
                                    searchInput.value = '';
                                    searchInput.disabled = true;
                                });
                                resultsDiv.appendChild(item);
                            });
                            resultsDiv.style.display = 'block';
                        } else {
                            resultsDiv.innerHTML = '<div class="list-group-item text-muted">' +
                                'No users found</div>';
                            resultsDiv.style.display = 'block';
                        }
                    })
                    .catch(() => {
                        resultsDiv.innerHTML = '<div class="list-group-item text-danger">' +
                            'Search failed</div>';
                        resultsDiv.style.display = 'block';
                    });
            }, 300);
        });

        // Close results when clicking outside
        document.addEventListener('click', function (e) {
            if (!searchInput.contains(e.target) && !resultsDiv.contains(e.target)) {
                resultsDiv.style.display = 'none';
            }
        });

        // Allow clearing selection
        selectedDiv.addEventListener('dblclick', function () {
            hiddenInput.value = '';
            selectedDiv.style.display = 'none';
            searchInput.disabled = false;
            searchInput.focus();
        });

        document.addEventListener('DOMContentLoaded', function () {
            const selectedId = hiddenInput.value;
            const authorityId = document.getElementById('authorityId')?.value;
            if (!selectedId || !authorityId) {
                return;
            }

            fetch('/api/users/search?q=' + encodeURIComponent(selectedNameSpan.textContent || '')
                + '&role=' + encodeURIComponent(role)
                + '&authorityId=' + encodeURIComponent(authorityId))
                .then(r => r.json())
                .then(data => {
                    const allowed = (data.data || []).some(user => String(user.id) === String(selectedId));
                    if (!allowed) {
                        hiddenInput.value = '';
                        selectedDiv.style.display = 'none';
                        searchInput.disabled = false;
                    }
                })
                .catch(() => {});
        });
    }

    // Setup search for Headman (only eligible HEADSMAN-role users)
    setupUserSearch('headmanSearch', 'headmanResults', 'headmanSelected',
        'headmanSelectedName', 'headmanId', 'ROLE_HEADSMAN', 'authorityId');
</script>
</body>
</html>
