<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Village Management | TALOMS</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/taloms.css}" rel="stylesheet">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: navbar('villages')}"></nav>

<div class="container-fluid px-4 py-4">

    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible fade show border-0 shadow-sm mb-4">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}"
         class="alert alert-danger alert-dismissible fade show border-0 shadow-sm mb-4">
        <i class="bi bi-exclamation-circle-fill me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex align-items-start justify-content-between mb-4 flex-wrap gap-3">
        <div>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-1 small">
                    <li class="breadcrumb-item">
                        <a th:href="@{/dashboard}" class="text-muted text-decoration-none">Dashboard</a>
                    </li>
                    <li class="breadcrumb-item active">Villages</li>
                </ol>
            </nav>
            <h4 class="fw-bold text-navy mb-0">
                <i class="bi bi-house me-2"></i>Village Management
            </h4>
            <p class="text-muted small mb-0">View and manage villages</p>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-0 d-flex justify-content-between align-items-center py-3">
            <h6 class="fw-bold text-navy mb-0">
                <i class="bi bi-list-ul me-2"></i>Villages
            </h6>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                    <tr>
                        <th class="px-4">Village Name</th>
                        <th>Region</th>
                        <th>Headman</th>
                        <th>Status</th>
                        <th class="px-4">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(villages)}">
                        <td colspan="5" class="text-center py-5 text-muted">
                            <i class="bi bi-inbox display-6 d-block mb-2"></i>
                            No villages found
                        </td>
                    </tr>
                    <tr th:each="village : ${villages}">
                        <td class="px-4 fw-semibold" th:text="${village.villageName}">Village Name</td>
                        <td th:text="${village.region}">Region</td>
                        <td th:text="${village.headmanName}">Headman</td>
                        <td>
                            <span th:if="${village.active != null && village.active}"
                                  class="badge bg-success">Active</span>
                            <span th:unless="${village.active != null && village.active}"
                                  class="badge bg-secondary">Inactive</span>
                        </td>
                        <td class="px-4">
                            <form th:action="@{/villages/{id}/deactivate(id=${village.id})}"
                                  method="post" class="d-inline"
                                  th:if="${village.active != null && village.active}">
                                <button type="submit" class="btn btn-outline-danger btn-sm">
                                    <i class="bi bi-pause me-1"></i>Deactivate
                                </button>
                            </form>
                            <form th:action="@{/villages/{id}/activate(id=${village.id})}"
                                  method="post" class="d-inline"
                                  th:unless="${village.active != null && village.active}">
                                <button type="submit" class="btn btn-outline-success btn-sm">
                                    <i class="bi bi-play me-1"></i>Activate
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
