<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | TALOMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/taloms.css}" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav th:replace="~{fragments/navbar :: navbar('dashboard')}"></nav>

    <!-- Page Content -->
    <div class="container-fluid px-4 py-4">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0 text-navy">System Administration</h4>
        </div>

        <!-- Primary KPI Row -->
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body d-flex align-items-center justify-content-between">
                        <div>
                            <h6 class="text-muted mb-1">Total Users</h6>
                            <h3 class="fw-bold mb-0 text-navy" th:text="${totalUsers != null ? totalUsers : '0'}">0</h3>
                        </div>
                        <div class="text-primary fs-3"><i class="bi bi-people"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body d-flex align-items-center justify-content-between">
                        <div>
                            <h6 class="text-muted mb-1">Authorities</h6>
                            <h3 class="fw-bold mb-0 text-navy" th:text="${totalAuthorities != null ? totalAuthorities : '0'}">0</h3>
                        </div>
                        <div class="text-warning fs-3"><i class="bi bi-bank"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body d-flex align-items-center justify-content-between">
                        <div>
                            <h6 class="text-muted mb-1">Companies</h6>
                            <h3 class="fw-bold mb-0 text-navy" th:text="${totalCompanies != null ? totalCompanies : '0'}">0</h3>
                        </div>
                        <div class="text-success fs-3"><i class="bi bi-buildings"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body d-flex align-items-center justify-content-between">
                        <div>
                            <h6 class="text-muted mb-1">Audit Logs</h6>
                            <h3 class="fw-bold mb-0 text-navy" th:text="${totalAuditLogs != null ? totalAuditLogs : '0'}">0</h3>
                        </div>
                        <div class="text-danger fs-3"><i class="bi bi-shield-check"></i></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recent Activity -->
        <div class="row g-3">
            <div class="col-12">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white border-0 d-flex justify-content-between align-items-center py-3">
                        <h6 class="fw-bold text-navy mb-0">
                            Recent System Activity
                        </h6>
                        <a th:href="@{/audit}" class="btn btn-outline-secondary btn-sm">
                            View All Logs
                        </a>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0 align-middle">
                                <thead class="table-light text-muted small">
                                    <tr>
                                        <th class="px-4">Action</th>
                                        <th>Entity</th>
                                        <th>Performed By</th>
                                        <th>Date &amp; Time</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${recentActivity == null or #lists.isEmpty(recentActivity)}">
                                        <td colspan="4" class="text-center py-5">
                                            <div class="text-muted mb-3">There is currently no recent system activity recorded.</div>
                                            <a th:href="@{/audit}" class="btn btn-outline-primary btn-sm">View All Logs</a>
                                        </td>
                                    </tr>
                                    <tr th:each="activity : ${recentActivity}" th:unless="${recentActivity == null or #lists.isEmpty(recentActivity)}">
                                        <td class="px-4">
                                            <span class="badge" th:classappend="${activity.badgeClass != null ? activity.badgeClass : 'bg-secondary'}"
                                                th:text="${activity.actionDisplay != null ? activity.actionDisplay : 'Unknown'}">Action</span>
                                        </td>
                                        <td>
                                            <span class="fw-medium small" th:text="${activity.entityTypeDisplay != null ? activity.entityTypeDisplay : 'Unknown'}">Entity</span>
                                            <span class="text-muted small" th:text="' #' + ${activity.entityId}">ID</span>
                                        </td>
                                        <td class="small" th:text="${activity.performedBy != null ? activity.performedBy : 'System'}">User</td>
                                        <td class="small text-muted" th:text="${activity.performedAtDisplay != null ? activity.performedAtDisplay : ''}">Date</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/offline-db.js}"></script>
    <script th:src="@{/js/taloms.js}"></script>
    <script>
        if (window.Taloms && Taloms.Network) {
            Taloms.Network.init();
            Taloms.Sync.init();
        }
        if (typeof navigator !== 'undefined' && navigator.serviceWorker) {
            navigator.serviceWorker.register('/sw.js')
                .then(function (reg) {
                    if (reg.waiting) {
                        reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                    }
                })
                .catch(function (err) { console.error('SW registration failed:', err); });
        }
    </script>
</body>
</html>
