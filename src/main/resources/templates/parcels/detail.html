<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${'Parcel ' + parcel.parcelNumber + ' | TALOMS'}">Parcel Detail | TALOMS</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/taloms.css}" rel="stylesheet">
    <link rel="stylesheet" href="/css/leaflet.min.css" />
    <style>
        #map { height: 460px; border-radius: 8px; margin-top: 10px; }
        .info-card { border-left: 4px solid #1B3A6B; }
    </style>
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: navbar('parcels')}"></nav>

<div class="container-fluid px-4 py-4">
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show border-0 shadow-sm mb-4">
        <i class="bi bi-exclamation-circle-fill me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex align-items-start justify-content-between mb-4 flex-wrap gap-3">
        <div>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-1 small">
                    <li class="breadcrumb-item"><a th:href="@{/dashboard}" class="text-muted text-decoration-none">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/parcels}" class="text-muted text-decoration-none">Parcels</a></li>
                    <li class="breadcrumb-item active" th:text="${parcel.parcelNumber}">Parcel</li>
                </ol>
            </nav>
            <h4 class="fw-bold text-navy mb-0">
                <i class="bi bi-map me-2"></i>Parcel <span th:text="${parcel.parcelNumber}">PRC</span>
            </h4>
            <p class="text-muted small mb-0">
                Stand <strong th:text="${parcel.standNumber}">Stand</strong> ·
                <span th:text="${parcel.villageName != null ? parcel.villageName : '—'}">Village</span>
            </p>
        </div>
        <div class="d-flex gap-2 flex-wrap">
            <a th:href="@{/parcels/{id}/edit(id=${parcel.id})}" class="btn btn-outline-primary px-3">
                <i class="bi bi-pencil-square me-1"></i>Edit
            </a>
            <a th:href="@{/parcels}" class="btn btn-outline-secondary px-3">
                <i class="bi bi-arrow-left me-1"></i>Back
            </a>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-12 col-lg-5">
            <div class="card border-0 shadow-sm mb-4 info-card">
                <div class="card-header bg-white border-bottom py-3">
                    <h6 class="fw-bold text-navy mb-0"><i class="bi bi-info-circle me-2"></i>Parcel Details</h6>
                </div>
                <div class="card-body p-4">
                    <dl class="row mb-0 small">
                        <dt class="col-5 text-muted">Parcel Number</dt>
                        <dd class="col-7 fw-semibold" th:text="${parcel.parcelNumber}">—</dd>

                        <dt class="col-5 text-muted">Stand Number</dt>
                        <dd class="col-7 fw-semibold" th:text="${parcel.standNumber}">—</dd>

                        <dt class="col-5 text-muted">Village</dt>
                        <dd class="col-7 fw-semibold" th:text="${parcel.villageName != null ? parcel.villageName : '—'}">—</dd>

                        <dt class="col-5 text-muted">Authority</dt>
                        <dd class="col-7 fw-semibold" th:text="${parcel.authorityName != null ? parcel.authorityName : '—'}">—</dd>

                        <dt class="col-5 text-muted">Status</dt>
                        <dd class="col-7">
                            <span th:class="${'badge ' + (parcel.statusBadgeClass != null ? parcel.statusBadgeClass : 'bg-secondary')}"
                                  th:text="${parcel.statusDisplay != null ? parcel.statusDisplay : parcel.status}">—</span>
                        </dd>

                        <dt class="col-5 text-muted">Area</dt>
                        <dd class="col-7 fw-semibold" th:text="${parcel.areaM2 != null ? #numbers.formatDecimal(parcel.areaM2, 1, 2) + ' m²' : '—'}">—</dd>

                        <dt class="col-5 text-muted">Area (ha)</dt>
                        <dd class="col-7 fw-semibold" th:text="${parcel.areaHectares != null ? #numbers.formatDecimal(parcel.areaHectares, 1, 4) + ' ha' : '—'}">—</dd>

                        <dt class="col-5 text-muted">Perimeter</dt>
                        <dd class="col-7 fw-semibold" th:text="${parcel.perimeterM != null ? #numbers.formatDecimal(parcel.perimeterM, 1, 2) + ' m' : '—'}">—</dd>

                        <dt class="col-5 text-muted">Boundary Points</dt>
                        <dd class="col-7 fw-semibold" th:text="${parcel.boundaryCount != null ? parcel.boundaryCount : 0}">0</dd>

                        <dt class="col-5 text-muted">Notes</dt>
                        <dd class="col-7" th:text="${parcel.notes != null and !#strings.isEmpty(parcel.notes) ? parcel.notes : '—'}">—</dd>
                    </dl>
                </div>
            </div>

        </div>

        <div class="col-12 col-lg-7">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white border-bottom py-3">
                    <h6 class="fw-bold text-navy mb-0"><i class="bi bi-map me-2"></i>Boundary Map</h6>
                </div>
                <div class="card-body p-4">
                    <!-- <div class="alert alert-light border small mb-2">
                        Parcel boundaries are plotted on the map below.
                    </div> -->
                    <div id="map"></div>
                    <div class="d-flex justify-content-between mt-2 text-muted small">
                        <span id="areaPreview">Area: —</span>
                        <span id="perimeterPreview">Perimeter: —</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/leaflet.min.js"></script>
<script th:inline="javascript">
    const boundaryPoints = /*[[${parcel.boundaries != null ? parcel.boundaries : {}}]]*/ [];
    const points = (boundaryPoints || [])
        .map((p, idx) => ({
            sequence: Number.isFinite(Number(p.sequence)) ? Number(p.sequence) : idx + 1,
            latitude: Number(p.latitude),
            longitude: Number(p.longitude)
        }))
        .filter(p => Number.isFinite(p.latitude) && Number.isFinite(p.longitude));

    function haversineDistanceM(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const toRad = d => d * Math.PI / 180;
        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
        return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function calculateArea(points) {
        if (points.length < 3) return 0;
        const ring = [...points, points[0]];
        let area = 0;
        for (let i = 0; i < ring.length - 1; i++) {
            area += ring[i].latitude * ring[i + 1].longitude;
            area -= ring[i + 1].latitude * ring[i].longitude;
        }
        area = Math.abs(area) / 2;
        const latAvg = points.reduce((sum, p) => sum + p.latitude, 0) / points.length;
        const metersPerDegLat = 111132;
        const metersPerDegLng = 111320 * Math.cos(latAvg * Math.PI / 180);
        return area * metersPerDegLat * metersPerDegLng;
    }

    function calculatePerimeter(points) {
        if (points.length < 2) return 0;
        let perimeter = 0;
        for (let i = 0; i < points.length; i++) {
            const j = (i + 1) % points.length;
            perimeter += haversineDistanceM(points[i].latitude, points[i].longitude, points[j].latitude, points[j].longitude);
        }
        return perimeter;
    }

    const map = L.map('map').setView([-25.0, 28.0], 8);
    (function () {
        function isSlowConnection() {
            var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            return !!(conn && (conn.effectiveType === '2g' || conn.effectiveType === 'slow-2g' || conn.saveData));
        }
        var tileUrl = isSlowConnection()
            ? 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png'
            : 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
        var attribution = isSlowConnection()
            ? '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
            : '&copy; OpenStreetMap contributors';
        var maxZoom = isSlowConnection() ? 16 : 19;
        L.tileLayer(tileUrl, { attribution: attribution, maxZoom: maxZoom }).addTo(map);
    })();

    if (points.length) {
        const latlngs = points.map(p => [p.latitude, p.longitude]);
        L.polygon(latlngs, { color: '#1B3A6B', weight: 3, fillColor: '#1B3A6B', fillOpacity: 0.15 }).addTo(map);

        points.forEach(p => {
            L.marker([p.latitude, p.longitude], {
                icon: L.divIcon({
                    className: 'point-marker',
                    html: p.sequence,
                    iconSize: [24, 24],
                    iconAnchor: [12, 12]
                })
            }).addTo(map);
        });

        const bounds = L.latLngBounds(latlngs);
        if (bounds.isValid()) map.fitBounds(bounds, { padding: [30, 30] });

        document.getElementById('areaPreview').textContent = `Area: ${calculateArea(points).toFixed(2)} m²`;
        document.getElementById('perimeterPreview').textContent = `Perimeter: ${calculatePerimeter(points).toFixed(2)} m`;
    }
</script>
</body>
</html>
