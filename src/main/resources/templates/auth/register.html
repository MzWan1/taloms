<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | TALOMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/taloms.css}" rel="stylesheet">
</head>
<body class="bg-navy min-vh-100 d-flex align-items-center justify-content-center">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

            <!-- Logo -->
            <div class="text-center mb-4">
                <div class="bg-white rounded-circle d-inline-flex
                            align-items-center justify-content-center mb-3"
                     style="width:72px;height:72px;">
                    <i class="bi bi-geo-alt-fill text-navy fs-2"></i>
                </div>
                <h1 class="text-white fw-bold fs-3">TALOMS</h1>
                <p class="text-white-50 small">
                    Create a resident account to access your Proofs of Residence
                </p>
            </div>

            <!-- Card -->
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-4 p-sm-5">
                    <h2 class="card-title text-center fw-bold text-navy mb-1 fs-5">
                        Resident Registration
                    </h2>
                    <p class="text-center text-muted small mb-4">
                        Accounts are created with resident access only.
                    </p>

                    <div th:if="${successMessage}" class="alert alert-success py-2 small" role="alert">
                        <i class="bi bi-check-circle me-1"></i><span th:text="${successMessage}"></span>
                    </div>
                    <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert">
                        <i class="bi bi-exclamation-circle me-1"></i><span th:text="${errorMessage}"></span>
                    </div>

                    <form th:action="@{/register}" th:object="${registerForm}" method="post">
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold small">Full Name</label>
                            <input type="text" id="fullName" th:field="*{fullName}"
                                   class="form-control" placeholder="e.g. Thabo Nkosi" required>
                        </div>

                        <div class="mb-3">
                            <label for="idNumber" class="form-label fw-semibold small">SA ID Number</label>
                            <input type="text" id="idNumber" th:field="*{idNumber}"
                                   class="form-control" maxlength="13"
                                   placeholder="13-digit South African ID" required>
                            <div class="form-text small">
                                Used to link you to the PTO(s) you hold as owner.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold small">Email Address</label>
                            <input type="email" id="email" th:field="*{email}"
                                   class="form-control" placeholder="you@example.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold small">Username</label>
                            <input type="text" id="username" th:field="*{username}"
                                   class="form-control" minlength="3" maxlength="50"
                                   placeholder="Choose a username" required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold small">Password</label>
                            <input type="password" id="password" th:field="*{password}"
                                   class="form-control" minlength="8"
                                   placeholder="At least 8 characters" required>
                        </div>

                        <button type="submit" class="btn btn-navy w-100 fw-semibold py-2">
                            <i class="bi bi-person-plus me-2"></i>Create Resident Account
                        </button>
                    </form>

                    <div class="text-center mt-4 small">
                        <span class="text-muted">Already have an account?</span>
                        <a th:href="@{/login}" class="text-navy text-decoration-none fw-semibold">Sign in</a>
                    </div>
                </div>
            </div>

            <p class="text-center text-white-50 small mt-4">
                &copy; 2026 TALOMS &mdash; Traditional Authority Land System
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
