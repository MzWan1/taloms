<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
    <div th:fragment="pagination(page, baseUrl)" th:if="${page.totalPages > 1}">
        <nav aria-label="Page navigation" class="mt-4">
            <ul class="pagination justify-content-center">
                <!-- Previous Button -->
                <li class="page-item" th:classappend="${page.first ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{${baseUrl}(page=${page.number - 1}, size=${page.size}, search=${param.search}, status=${param.status})}" tabindex="-1">Previous</a>
                </li>

                <!-- Page Numbers -->
                <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}" 
                    th:classappend="${page.number == i ? 'active' : ''}">
                    <a class="page-link" th:href="@{${baseUrl}(page=${i}, size=${page.size}, search=${param.search}, status=${param.status})}" th:text="${i + 1}">1</a>
                </li>

                <!-- Next Button -->
                <li class="page-item" th:classappend="${page.last ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{${baseUrl}(page=${page.number + 1}, size=${page.size}, search=${param.search}, status=${param.status})}">Next</a>
                </li>
            </ul>
        </nav>
        <div class="text-center mt-2 text-muted small">
            Showing <span th:text="${page.number * page.size + 1}"></span>–<span th:text="${page.number * page.size + page.numberOfElements}"></span> of <span th:text="${page.totalElements}"></span> records
        </div>
    </div>
</body>
</html>
