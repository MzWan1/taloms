<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!--
      Pagination fragment.
      Expects a "page" object (Spring Data Page) and a "baseUrl" string.
      Also supports an optional "queryParams" string for preserving search filters.
    -->
    <div th:fragment="pagination(page, baseUrl, queryParams)" th:if="${page != null and page.totalPages > 1}" class="d-flex justify-content-between align-items-center mt-4">
        <div class="text-muted small">
            Showing <span th:text="${page.number * page.size + 1}"></span>–<span th:text="${page.number * page.size + page.numberOfElements}"></span> of <span th:text="${page.totalElements}"></span>
        </div>
        <nav aria-label="Page navigation">
            <ul class="pagination pagination-sm mb-0">
                
                <!-- Previous Button -->
                <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                    <a class="page-link" th:href="${page.first} ? '#' : @{${baseUrl}(page=${page.number}, size=${page.size}) + (${queryParams} != null ? '&' + ${queryParams} : '')}" tabindex="-1" aria-disabled="true">Previous</a>
                </li>
                
                <!-- Page Numbers -->
                <li class="page-item" th:each="i : ${#numbers.sequence(1, page.totalPages)}" th:classappend="${i == page.number + 1} ? 'active'">
                    <a class="page-link" th:href="@{${baseUrl}(page=${i}, size=${page.size}) + (${queryParams} != null ? '&' + ${queryParams} : '')}" th:text="${i}">1</a>
                </li>
                
                <!-- Next Button -->
                <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                    <a class="page-link" th:href="${page.last} ? '#' : @{${baseUrl}(page=${page.number + 2}, size=${page.size}) + (${queryParams} != null ? '&' + ${queryParams} : '')}">Next</a>
                </li>
                
            </ul>
        </nav>
    </div>
</body>
</html>
