<th:block xmlns:th="http://www.thymeleaf.org"
          xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1B3A6B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" th:href="@{/manifest.webmanifest}">
  <link rel="apple-touch-icon" th:href="@{/icons/icon.svg}">

  <!-- Bootstrap + Icons (local for offline) -->
  <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
  <link th:href="@{/css/bootstrap-icons.css}" rel="stylesheet">

  <!-- Leaflet (conditionally loaded by JS for map pages) -->
  <th:block th:if="${showMap == true}">
    <link th:href="@{/css/leaflet.min.css}" rel="stylesheet">
  </th:block>

  <link th:href="@{/css/taloms.css}" rel="stylesheet">

  <title th:insert="${pageTitle} + ' | TALOMS'">TALOMS</title>
</th:block>
