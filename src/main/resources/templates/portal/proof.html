<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Proof of Residence | TALOMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/taloms.css}" rel="stylesheet">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: navbar('portal')}"></nav>

<div class="container-fluid px-4 py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6 col-xl-5">

            <a th:href="@{/portal}" class="btn btn-light border mb-3">
                <i class="bi bi-arrow-left me-1"></i>Back to My Proofs
            </a>

            <div th:if="${errorMessage}" class="alert alert-danger border-0 shadow-sm">
                <i class="bi bi-exclamation-circle-fill me-2"></i><span th:text="${errorMessage}"></span>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-sm-5">
                    <div class="text-center mb-4">
                        <div class="rounded-3 bg-light d-inline-flex align-items-center justify-content-center mb-3"
                             style="width:64px;height:64px;">
                            <i class="bi bi-stamp text-navy fs-2"></i>
                        </div>
                        <h4 class="fw-bold text-navy mb-1">Proof of Residence</h4>
                        <p class="text-muted small mb-0">
                            <span th:text="${pto.ptoNumber}">PTO-00001</span>
                            &middot; <span th:text="${pto.ptoHolderName}">Holder</span>
                        </p>
                        <p class="text-muted small mb-0">
                            <span th:text="${pto.villageName ?: '—'}">Village</span>
                        </p>
                    </div>

                    <div class="alert alert-info small">
                        <i class="bi bi-shield-lock me-1"></i>
                        Enter your password to confirm your identity. The stamped
                        proof of residence will then be downloaded.
                    </div>

                    <form th:action="@{/portal/proof/{id}(id=${ptoId})}" method="post">
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold small">Your Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="bi bi-lock text-muted"></i>
                                </span>
                                <input type="password" id="password" name="password"
                                       class="form-control border-start-0" autocomplete="current-password"
                                       placeholder="Enter your password" required autofocus>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-navy w-100 fw-semibold py-2">
                            <i class="bi bi-download me-2"></i>Download Proof of Residence
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
