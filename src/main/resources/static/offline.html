<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - TALOMS</title>
  <meta name="theme-color" content="#1B3A6B">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f8f9fa;
      color: #333;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 500px;
    }
    .icon {
      font-size: 64px;
      color: #1B3A6B;
      margin-bottom: 24px;
    }
    h1 {
      color: #1B3A6B;
      font-size: 28px;
      margin-bottom: 12px;
    }
    p {
      color: #6c757d;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: #B8860B;
      color: #fff;
      border-radius: 20px;
      font-size: 14px;
      margin-top: 16px;
    }
    a {
      color: #1B3A6B;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">&#128269;</div>
    <h1>You are offline</h1>
    <p>TALOMS is running in offline mode. You can continue working — your changes will sync automatically when connectivity returns.</p>
    <div style="margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;">
      <a href="/dashboard" style="display:inline-block; padding:10px 24px; background:#1B3A6B; color:#fff; border-radius:6px; text-decoration:none;">Dashboard</a>
      <a href="/parcels" style="display:inline-block; padding:10px 24px; background:#1B3A6B; color:#fff; border-radius:6px; text-decoration:none;">Parcels</a>
      <a href="/parcels/create" style="display:inline-block; padding:10px 24px; background:#B8860B; color:#fff; border-radius:6px; text-decoration:none;">Create Parcel</a>
      <a href="/ptos" style="display:inline-block; padding:10px 24px; background:#1B3A6B; color:#fff; border-radius:6px; text-decoration:none;">PTOs</a>
      <a href="/gis" style="display:inline-block; padding:10px 24px; background:#1B3A6B; color:#fff; border-radius:6px; text-decoration:none;">GIS Map</a>
    </div>
    <div class="badge" style="margin-top: 24px;">Offline mode active</div>
  </div>
</body>
</html>
